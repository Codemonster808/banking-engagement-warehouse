name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:latest
        ports: ["4566:4566"]
    env:
      LLM_PROVIDER: fake
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/bootstrap.py
      - run: python3 src/ingestion/data_gen.py --months 6 --customers 200 --out data/bronze --seed 42
      - run: pytest tests/ features/ -v --ignore=tests/data_quality/test_e2e.py --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=32
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt

  e2e:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:latest
        ports: ["4566:4566"]
    env:
      LLM_PROVIDER: fake
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/bootstrap.py
      - run: pytest tests/data_quality/test_e2e.py -v -s
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            benchmarks/quality-report.json
            docs/quality-report.md
