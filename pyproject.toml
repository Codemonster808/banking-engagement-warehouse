[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.12"
# pyspark/boto3/duckdb/delta-spark ship no type stubs
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.models.*", "src.utils.*"]
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/orchestration/lambdas/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 32
show_missing = true
